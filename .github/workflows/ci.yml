name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: Scripts/build-app.sh
